# BankSphere production stack.
#   cp .env.example .env      # fill in every CHANGE_ME (see README > Production deployment)
#   docker compose up -d --build
#   docker compose run --rm -e ADMIN_EMAIL=... -e ADMIN_PASSWORD=... auth-service node dist/scripts/create-admin.js
#
# Networks (only the gateway publishes a port: put a TLS-terminating load balancer in front of it):
#   edge     gateway only (published port)
#   apps     internal: gateway <-> services, plus the rate-limit Redis
#   backend  internal: services <-> Postgres, Redis, Kafka
#   egress   outbound internet, only for services that must reach it: email (auth, notification), Razorpay
#            (payment) and the LLM API (assistant)
# Every other service has no route to the internet at all.
# Data tier: Postgres behind PgBouncer; three Redis instances with different jobs (security state, edge rate
# limits/bans, evictable caches + real-time fan-out); Kafka with one SCRAM user and ACL set per service.
# For local development add the dev overlay:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

x-node-healthcheck: &node-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: "1" # requests arrive through the API gateway
  # Prometheus scrape port (internal networks only; the gateway never routes it)
  METRICS_PORT: "9464"
  # Staff tokens are refused from outside these networks on every route (by role, not path)
  STAFF_ALLOWED_CIDRS: ${STAFF_ALLOWED_CIDRS:?set STAFF_ALLOWED_CIDRS in .env}
  JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:?set JWT_VERIFY_KEYS in .env}
  # Read-only Redis ACL user (token versions + revoked jtis); auth and customer override it
  REDIS_URL: redis://reader:${REDIS_READER_PASSWORD:?set REDIS_READER_PASSWORD in .env}@redis:6379
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:29092

x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  mem_limit: 384m
  healthcheck: *node-healthcheck
  networks: [apps, backend]
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

# Runtime DATABASE_URLs go through PgBouncer (transaction pooling, see docker/pgbouncer/start.sh) and end in
#   &pgbouncer=true&connection_limit=10&pool_timeout=10
# pgbouncer=true makes Prisma avoid named prepared statements; connection_limit is one replica's client slots.

networks:
  edge: {}
  apps:
    internal: true
  backend:
    internal: true # no route to the outside world
  egress: {}

services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    restart: always
    mem_limit: 768m
    networks: [backend]
    # Sized for this container's memory; on a dedicated host scale shared_buffers to ~25 % of RAM.
    # max_connections stays modest because PgBouncer multiplexes clients onto at most 80 backends.
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-banksphere}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
      PGTZ: UTC
      AUTH_DB_OWNER_PASSWORD: ${AUTH_DB_OWNER_PASSWORD:?set in .env}
      AUTH_DB_APP_PASSWORD: ${AUTH_DB_APP_PASSWORD:?set in .env}
      CUSTOMER_DB_OWNER_PASSWORD: ${CUSTOMER_DB_OWNER_PASSWORD:?set in .env}
      CUSTOMER_DB_APP_PASSWORD: ${CUSTOMER_DB_APP_PASSWORD:?set in .env}
      ACCOUNT_DB_OWNER_PASSWORD: ${ACCOUNT_DB_OWNER_PASSWORD:?set in .env}
      ACCOUNT_DB_APP_PASSWORD: ${ACCOUNT_DB_APP_PASSWORD:?set in .env}
      LEDGER_DB_OWNER_PASSWORD: ${LEDGER_DB_OWNER_PASSWORD:?set in .env}
      LEDGER_DB_APP_PASSWORD: ${LEDGER_DB_APP_PASSWORD:?set in .env}
      NOTIFICATION_DB_OWNER_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD:?set in .env}
      NOTIFICATION_DB_APP_PASSWORD: ${NOTIFICATION_DB_APP_PASSWORD:?set in .env}
      FRAUD_DB_OWNER_PASSWORD: ${FRAUD_DB_OWNER_PASSWORD:?set in .env}
      FRAUD_DB_APP_PASSWORD: ${FRAUD_DB_APP_PASSWORD:?set in .env}
      PAYMENT_DB_OWNER_PASSWORD: ${PAYMENT_DB_OWNER_PASSWORD:?set in .env}
      PAYMENT_DB_APP_PASSWORD: ${PAYMENT_DB_APP_PASSWORD:?set in .env}
      ASSISTANT_DB_OWNER_PASSWORD: ${ASSISTANT_DB_OWNER_PASSWORD:?set in .env}
      ASSISTANT_DB_APP_PASSWORD: ${ASSISTANT_DB_APP_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-init-schemas.sh:ro
    healthcheck:
      # Over TCP: during first-time initialisation (init-schemas.sh) the server only listens on its unix
      # socket, so this stays unhealthy until the roles and schemas exist and the real server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Security state (token versions, revoked jtis, lockouts): AOF-persisted and never evicted
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: always
    mem_limit: 320m
    networks: [backend]
    # ACL users per service (docker/redis/start.sh): only auth-service can change security state
    environment:
      REDIS_AUTH_PASSWORD: ${REDIS_AUTH_PASSWORD:?set REDIS_AUTH_PASSWORD in .env}
      REDIS_CUSTOMER_PASSWORD: ${REDIS_CUSTOMER_PASSWORD:?set REDIS_CUSTOMER_PASSWORD in .env}
      REDIS_READER_PASSWORD: ${REDIS_READER_PASSWORD:?set REDIS_READER_PASSWORD in .env}
    command: ["sh", "/usr/local/etc/redis/start.sh"]
    volumes:
      - redis_data:/data
      - ./docker/redis/start.sh:/usr/local/etc/redis/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user reader --pass \"$$REDIS_READER_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job on every deployment: re-applies docker/postgres/init-schemas.sh (idempotent) as the superuser,
  # so schemas and roles of services added after the volume was created exist before migrations run
  db-bootstrap:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    networks: [backend]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-banksphere}
      AUTH_DB_OWNER_PASSWORD: ${AUTH_DB_OWNER_PASSWORD}
      AUTH_DB_APP_PASSWORD: ${AUTH_DB_APP_PASSWORD}
      CUSTOMER_DB_OWNER_PASSWORD: ${CUSTOMER_DB_OWNER_PASSWORD}
      CUSTOMER_DB_APP_PASSWORD: ${CUSTOMER_DB_APP_PASSWORD}
      ACCOUNT_DB_OWNER_PASSWORD: ${ACCOUNT_DB_OWNER_PASSWORD}
      ACCOUNT_DB_APP_PASSWORD: ${ACCOUNT_DB_APP_PASSWORD}
      LEDGER_DB_OWNER_PASSWORD: ${LEDGER_DB_OWNER_PASSWORD}
      LEDGER_DB_APP_PASSWORD: ${LEDGER_DB_APP_PASSWORD}
      NOTIFICATION_DB_OWNER_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD}
      NOTIFICATION_DB_APP_PASSWORD: ${NOTIFICATION_DB_APP_PASSWORD}
      FRAUD_DB_OWNER_PASSWORD: ${FRAUD_DB_OWNER_PASSWORD}
      FRAUD_DB_APP_PASSWORD: ${FRAUD_DB_APP_PASSWORD}
      PAYMENT_DB_OWNER_PASSWORD: ${PAYMENT_DB_OWNER_PASSWORD}
      PAYMENT_DB_APP_PASSWORD: ${PAYMENT_DB_APP_PASSWORD}
      ASSISTANT_DB_OWNER_PASSWORD: ${ASSISTANT_DB_OWNER_PASSWORD}
      ASSISTANT_DB_APP_PASSWORD: ${ASSISTANT_DB_APP_PASSWORD}
      # Observability overlay only: the pg_monitor role for postgres-exporter (empty = not created)
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-}
    volumes:
      - ./docker/postgres/init-schemas.sh:/init-schemas.sh:ro
    entrypoint: ["sh", "/init-schemas.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Transaction-pooling proxy in front of Postgres for every service (migrations bypass it)
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    restart: always
    read_only: true
    # A block entry: in a flow list ([...]) the commas would split the options into separate mounts
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 96m
    networks: [backend]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banksphere}
      AUTH_DB_APP_PASSWORD: ${AUTH_DB_APP_PASSWORD}
      CUSTOMER_DB_APP_PASSWORD: ${CUSTOMER_DB_APP_PASSWORD}
      ACCOUNT_DB_APP_PASSWORD: ${ACCOUNT_DB_APP_PASSWORD}
      LEDGER_DB_APP_PASSWORD: ${LEDGER_DB_APP_PASSWORD}
      NOTIFICATION_DB_APP_PASSWORD: ${NOTIFICATION_DB_APP_PASSWORD}
      FRAUD_DB_APP_PASSWORD: ${FRAUD_DB_APP_PASSWORD}
      PAYMENT_DB_APP_PASSWORD: ${PAYMENT_DB_APP_PASSWORD}
      ASSISTANT_DB_APP_PASSWORD: ${ASSISTANT_DB_APP_PASSWORD}
    volumes:
      - ./docker/pgbouncer/start.sh:/start.sh:ro
    entrypoint: ["sh", "/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  # Application caches and real-time fan-out: evictable, not persisted, one ACL user per service
  redis-cache:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: always
    mem_limit: 256m
    networks: [backend]
    environment:
      REDIS_CACHE_LEDGER_PASSWORD: ${REDIS_CACHE_LEDGER_PASSWORD:?set REDIS_CACHE_LEDGER_PASSWORD in .env}
      REDIS_CACHE_ACCOUNT_PASSWORD: ${REDIS_CACHE_ACCOUNT_PASSWORD:?set REDIS_CACHE_ACCOUNT_PASSWORD in .env}
      REDIS_CACHE_CUSTOMER_PASSWORD: ${REDIS_CACHE_CUSTOMER_PASSWORD:?set REDIS_CACHE_CUSTOMER_PASSWORD in .env}
      REDIS_CACHE_PAYMENT_PASSWORD: ${REDIS_CACHE_PAYMENT_PASSWORD:?set REDIS_CACHE_PAYMENT_PASSWORD in .env}
      REDIS_CACHE_ASSISTANT_PASSWORD: ${REDIS_CACHE_ASSISTANT_PASSWORD:?set REDIS_CACHE_ASSISTANT_PASSWORD in .env}
      REDIS_CACHE_REALTIME_PASSWORD: ${REDIS_CACHE_REALTIME_PASSWORD:?set REDIS_CACHE_REALTIME_PASSWORD in .env}
      # Observability overlay only: key-less `monitor` ACL user for redis_exporter (empty = not created)
      REDIS_CACHE_MONITOR_PASSWORD: ${REDIS_CACHE_MONITOR_PASSWORD:-}
    command: ["sh", "/usr/local/etc/redis/cache-start.sh"]
    volumes:
      - ./docker/redis/cache-start.sh:/usr/local/etc/redis/cache-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user realtime-svc --pass \"$$REDIS_CACHE_REALTIME_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Gateway rate-limit counters only: may evict, so a request flood can never exhaust security state
  redis-ratelimit:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: always
    mem_limit: 160m
    networks: [apps]
    environment:
      REDIS_PASSWORD: ${RATE_LIMIT_REDIS_PASSWORD:?set RATE_LIMIT_REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper), SASL-authenticated with per-service ACLs:
  # every service has its own SCRAM-SHA-512 user and may only produce/consume its own topics.
  # The PLAIN "admin" principal exists only inside the broker and the kafka-init job.
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: always
    mem_limit: 1g
    networks: [backend]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:?set KAFKA_ADMIN_PASSWORD in .env}" user_admin="${KAFKA_ADMIN_PASSWORD}";
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD}" user_admin="${KAFKA_ADMIN_PASSWORD}";
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required user_admin="${KAFKA_ADMIN_PASSWORD}";
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are created explicitly by kafka-init
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms384m -Xmx512m
      # Deliberately not KAFKA_-prefixed: the image would copy it into server.properties
      BROKER_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "printf 'security.protocol=SASL_PLAINTEXT\\nsasl.mechanism=PLAIN\\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"admin\" password=\"%s\";\\n' \"$$BROKER_ADMIN_PASSWORD\" > /tmp/admin.properties && /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/admin.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 30s

  # Creates topics, per-service SCRAM users and least-privilege ACLs (idempotent)
  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    networks: [backend]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      KAFKA_AUTH_PASSWORD: ${KAFKA_AUTH_PASSWORD:?set KAFKA_AUTH_PASSWORD in .env}
      KAFKA_ACCOUNT_PASSWORD: ${KAFKA_ACCOUNT_PASSWORD:?set KAFKA_ACCOUNT_PASSWORD in .env}
      KAFKA_LEDGER_PASSWORD: ${KAFKA_LEDGER_PASSWORD:?set KAFKA_LEDGER_PASSWORD in .env}
      KAFKA_FRAUD_PASSWORD: ${KAFKA_FRAUD_PASSWORD:?set KAFKA_FRAUD_PASSWORD in .env}
      KAFKA_NOTIFICATION_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD:?set KAFKA_NOTIFICATION_PASSWORD in .env}
      KAFKA_PAYMENT_PASSWORD: ${KAFKA_PAYMENT_PASSWORD:?set KAFKA_PAYMENT_PASSWORD in .env}
      KAFKA_REALTIME_PASSWORD: ${KAFKA_REALTIME_PASSWORD:?set KAFKA_REALTIME_PASSWORD in .env}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-12}
      # Observability overlay only: describe-only SCRAM user for kafka-exporter (empty = not created)
      KAFKA_MONITOR_PASSWORD: ${KAFKA_MONITOR_PASSWORD:-}
    volumes:
      - ./docker/kafka/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]

  # One-shot job: applies every service's migrations as that schema's OWNER role
  migrate:
    build: { context: ., target: build }
    networks: [backend]
    environment:
      AUTH_URL: postgresql://auth_owner:${AUTH_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=auth_schema
      CUSTOMER_URL: postgresql://customer_owner:${CUSTOMER_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=customer_schema
      ACCOUNT_URL: postgresql://account_owner:${ACCOUNT_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=account_schema
      TRANSACTION_URL: postgresql://ledger_owner:${LEDGER_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=ledger_schema
      NOTIFICATION_URL: postgresql://notification_owner:${NOTIFICATION_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=notification_schema
      FRAUD_URL: postgresql://fraud_owner:${FRAUD_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=fraud_schema
      PAYMENT_URL: postgresql://payment_owner:${PAYMENT_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=payment_schema
      ASSISTANT_URL: postgresql://assistant_owner:${ASSISTANT_DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=assistant_schema
    command:
      - sh
      - -c
      - |
        set -e
        for s in AUTH:auth CUSTOMER:customer ACCOUNT:account TRANSACTION:transaction NOTIFICATION:notification FRAUD:fraud PAYMENT:payment ASSISTANT:assistant; do
          var=$${s%%:*}_URL; svc=$${s##*:}
          echo "Migrating $$svc-service"
          # A few retries ride out a database that is still starting or restarting
          n=1
          until (cd services/$$svc-service && DATABASE_URL="$$(printenv $$var)" npx prisma migrate deploy); do
            if [ $$n -ge 5 ]; then echo "Migrating $$svc-service failed after $$n attempts" >&2; exit 1; fi
            echo "Migrating $$svc-service failed (attempt $$n), retrying in 5s" >&2
            n=$$((n + 1)); sleep 5
          done
        done
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  api-gateway:
    <<: *app
    build: { context: ., args: { SERVICE: api-gateway } }
    networks: [edge, apps]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8000
      # Number of proxies in front that OVERWRITE X-Forwarded-For (0 = none). Required: a wrong value breaks
      # per-IP limits and lockouts for everyone, so the gateway refuses to start without it.
      TRUST_PROXY: ${GATEWAY_TRUST_PROXY:?set GATEWAY_TRUST_PROXY in .env (0 if nothing sits in front of the gateway)}
      METRICS_PORT: "9464"
      # Edge Redis: GCRA buckets, IP rules mirror and bans (written by auth-service)
      REDIS_URL: redis://:${RATE_LIMIT_REDIS_PASSWORD}@redis-ratelimit:6379
      # Public keys only: the gateway verifies tokens to key per-user limits, it never authorizes
      JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:?set JWT_VERIFY_KEYS in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Comma-separated CIDRs (VPN/office) allowed to call staff-only APIs (required in production)
      STAFF_ALLOWED_CIDRS: ${STAFF_ALLOWED_CIDRS:?set STAFF_ALLOWED_CIDRS in .env}
      # Edge limits (design section 10); empty = the built-in default (see api-gateway/src/config.ts)
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-}
      GATEWAY_RATE_IP: ${GATEWAY_RATE_IP:-}
      GATEWAY_BURST_IP: ${GATEWAY_BURST_IP:-}
      GATEWAY_RATE_USER: ${GATEWAY_RATE_USER:-}
      GATEWAY_BURST_USER: ${GATEWAY_BURST_USER:-}
      GATEWAY_RATE_MONEY_WRITE: ${GATEWAY_RATE_MONEY_WRITE:-}
      GATEWAY_BURST_MONEY_WRITE: ${GATEWAY_BURST_MONEY_WRITE:-}
      GATEWAY_RATE_ASSISTANT: ${GATEWAY_RATE_ASSISTANT:-}
      GATEWAY_BURST_ASSISTANT: ${GATEWAY_BURST_ASSISTANT:-}
      GATEWAY_MAX_INFLIGHT: ${GATEWAY_MAX_INFLIGHT:-}
      GATEWAY_MAX_STREAMS: ${GATEWAY_MAX_STREAMS:-}
      AUTH_SERVICE_URL: http://auth-service:8001
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      ACCOUNT_SERVICE_URL: http://account-service:8003
      TRANSACTION_SERVICE_URL: http://transaction-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      FRAUD_SERVICE_URL: http://fraud-service:8006
      PAYMENT_SERVICE_URL: http://payment-service:8007
      ASSISTANT_SERVICE_URL: http://assistant-service:8008
      REALTIME_SERVICE_URL: http://realtime-service:8009
    depends_on:
      redis-ratelimit: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      # Asynchronous or optional: a consumer, SMTP or LLM problem must not keep the core banking API down
      notification-service: { condition: service_started }
      fraud-service: { condition: service_started }
      assistant-service: { condition: service_started }
      realtime-service: { condition: service_started }

  auth-service:
    <<: *app
    build: { context: ., args: { SERVICE: auth-service } }
    environment:
      <<: *service-env
      KAFKA_USERNAME: auth-svc
      KAFKA_PASSWORD: ${KAFKA_AUTH_PASSWORD}
      PORT: 8001
      REDIS_URL: redis://auth-svc:${REDIS_AUTH_PASSWORD}@redis:6379
      # Login/recovery counters live in the evictable rate-limit Redis, never in the security store
      RATE_LIMIT_REDIS_URL: redis://:${RATE_LIMIT_REDIS_PASSWORD}@redis-ratelimit:6379
      STAFF_EMAIL_DOMAIN: ${STAFF_EMAIL_DOMAIN:?set STAFF_EMAIL_DOMAIN in .env}
      KAFKA_CLIENT_ID: auth-service
      DATABASE_URL: postgresql://auth_app:${AUTH_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=auth_schema&pgbouncer=true&connection_limit=10&pool_timeout=10
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:?set JWT_SIGNING_KEY_ID in .env}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      # Secure attribute of the browser session cookie (bs_rt); keep it on
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
    networks: [apps, backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-ratelimit: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  customer-service:
    <<: *app
    build: { context: ., args: { SERVICE: customer-service } }
    environment:
      <<: *service-env
      PORT: 8002
      REDIS_URL: redis://customer-svc:${REDIS_CUSTOMER_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://customer_app:${CUSTOMER_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=customer_schema&pgbouncer=true&connection_limit=10&pool_timeout=10
      CACHE_REDIS_URL: redis://customer-svc:${REDIS_CACHE_CUSTOMER_PASSWORD}@redis-cache:6379
      CUSTOMER_INTERNAL_TOKEN: ${CUSTOMER_INTERNAL_TOKEN:?set CUSTOMER_INTERNAL_TOKEN in .env}

  account-service:
    <<: *app
    build: { context: ., args: { SERVICE: account-service } }
    environment:
      <<: *service-env
      KAFKA_USERNAME: account-svc
      KAFKA_PASSWORD: ${KAFKA_ACCOUNT_PASSWORD}
      PORT: 8003
      KAFKA_CLIENT_ID: account-service
      LEDGER_SERVICE_URL: http://transaction-service:8004
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      DATABASE_URL: postgresql://account_app:${ACCOUNT_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=account_schema&pgbouncer=true&connection_limit=10&pool_timeout=10
      CACHE_REDIS_URL: redis://account-svc:${REDIS_CACHE_ACCOUNT_PASSWORD}@redis-cache:6379
      LEDGER_INTERNAL_TOKEN: ${LEDGER_INTERNAL_TOKEN:?set LEDGER_INTERNAL_TOKEN in .env}
      CUSTOMER_INTERNAL_TOKEN: ${CUSTOMER_INTERNAL_TOKEN}

  transaction-service:
    <<: *app
    build: { context: ., args: { SERVICE: transaction-service } }
    environment:
      <<: *service-env
      KAFKA_USERNAME: ledger-svc
      KAFKA_PASSWORD: ${KAFKA_LEDGER_PASSWORD}
      PORT: 8004
      KAFKA_CLIENT_ID: transaction-service
      DATABASE_URL: postgresql://ledger_app:${LEDGER_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=ledger_schema&pgbouncer=true&connection_limit=10&pool_timeout=10
      CACHE_REDIS_URL: redis://ledger-svc:${REDIS_CACHE_LEDGER_PASSWORD}@redis-cache:6379
      LEDGER_INTERNAL_TOKEN: ${LEDGER_INTERNAL_TOKEN}
      # Separate credential for payment-service: it may credit/refund top-ups, never provision or close accounts
      PAYMENT_LEDGER_INTERNAL_TOKEN: ${PAYMENT_LEDGER_INTERNAL_TOKEN:?set PAYMENT_LEDGER_INTERNAL_TOKEN in .env}

  notification-service:
    <<: *app
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      <<: *service-env
      KAFKA_USERNAME: notification-svc
      KAFKA_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD}
      PORT: 8005
      KAFKA_CLIENT_ID: notification-service
      DATABASE_URL: postgresql://notification_app:${NOTIFICATION_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=notification_schema&pgbouncer=true&connection_limit=10&pool_timeout=10
      SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL:?set SECURITY_ALERT_EMAIL in .env}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM}
    networks: [apps, backend, egress]

  fraud-service:
    <<: *app
    build: { context: ., args: { SERVICE: fraud-service } }
    environment:
      <<: *service-env
      KAFKA_USERNAME: fraud-svc
      KAFKA_PASSWORD: ${KAFKA_FRAUD_PASSWORD}
      PORT: 8006
      KAFKA_CLIENT_ID: fraud-service
      DATABASE_URL: postgresql://fraud_app:${FRAUD_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=fraud_schema&pgbouncer=true&connection_limit=10&pool_timeout=10

  # Razorpay top-ups: needs the internet (Razorpay API) and receives Razorpay's webhooks through the gateway
  payment-service:
    <<: *app
    build: { context: ., args: { SERVICE: payment-service } }
    networks: [apps, backend, egress]
    environment:
      <<: *service-env
      KAFKA_USERNAME: payment-svc
      KAFKA_PASSWORD: ${KAFKA_PAYMENT_PASSWORD}
      KAFKA_CLIENT_ID: payment-service
      PORT: 8007
      DATABASE_URL: postgresql://payment_app:${PAYMENT_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=payment_schema&pgbouncer=true&connection_limit=10&pool_timeout=10
      CACHE_REDIS_URL: redis://payment-svc:${REDIS_CACHE_PAYMENT_PASSWORD}@redis-cache:6379
      LEDGER_SERVICE_URL: http://transaction-service:8004
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      PAYMENT_LEDGER_INTERNAL_TOKEN: ${PAYMENT_LEDGER_INTERNAL_TOKEN}
      CUSTOMER_INTERNAL_TOKEN: ${CUSTOMER_INTERNAL_TOKEN}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET in .env}
      RAZORPAY_API_BASE: ${RAZORPAY_API_BASE:-https://api.razorpay.com}
      RAZORPAY_ALLOW_TEST_KEYS: ${RAZORPAY_ALLOW_TEST_KEYS:-false}
      RAZORPAY_WEBHOOK_ALLOWED_CIDRS: ${RAZORPAY_WEBHOOK_ALLOWED_CIDRS:-}
      TOPUP_MIN_PAISE: ${TOPUP_MIN_PAISE:-100}
      TOPUP_MAX_PAISE: ${TOPUP_MAX_PAISE:-10000000}
      TOPUP_DAILY_LIMIT_PAISE: ${TOPUP_DAILY_LIMIT_PAISE:-20000000}
      TOPUP_ORDER_TTL_MINUTES: ${TOPUP_ORDER_TTL_MINUTES:-30}

  # Sphere assistant: calls the banking services with the customer's own token; internet only for the LLM API
  assistant-service:
    <<: *app
    build: { context: ., args: { SERVICE: assistant-service } }
    networks: [apps, backend, egress]
    environment:
      <<: *service-env
      PORT: 8008
      DATABASE_URL: postgresql://assistant_app:${ASSISTANT_DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-banksphere}?schema=assistant_schema&pgbouncer=true&connection_limit=10&pool_timeout=10
      CACHE_REDIS_URL: redis://assistant-svc:${REDIS_CACHE_ASSISTANT_PASSWORD}@redis-cache:6379
      ACCOUNT_SERVICE_URL: http://account-service:8003
      TRANSACTION_SERVICE_URL: http://transaction-service:8004
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      PAYMENT_SERVICE_URL: http://payment-service:8007
      # Leave LLM_API_KEY empty to use the built-in assistant (no data leaves the platform)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ASSISTANT_DAILY_TOKEN_BUDGET: ${ASSISTANT_DAILY_TOKEN_BUDGET:-50000}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}

  # Server-Sent Events fan-out: Kafka -> Redis pub/sub -> every replica's open streams
  realtime-service:
    <<: *app
    build: { context: ., args: { SERVICE: realtime-service } }
    environment:
      <<: *service-env
      KAFKA_USERNAME: realtime-svc
      KAFKA_PASSWORD: ${KAFKA_REALTIME_PASSWORD}
      KAFKA_CLIENT_ID: realtime-service
      PORT: 8009
      CACHE_REDIS_URL: redis://realtime-svc:${REDIS_CACHE_REALTIME_PASSWORD}@redis-cache:6379
      REALTIME_MAX_CONNECTIONS: ${REALTIME_MAX_CONNECTIONS:-10000}

volumes:
  postgres_data:
  redis_data:
  kafka_data:
